services:
  # 1. Database (Postgres with pgvector extension)
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis Message Broker (for Celery)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # 3. FastAPI Backend
  api:
    build: 
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/blot
      - REDIS_URL=redis://redis:6379/0

  # 4. Celery Worker Pool
  celery:
    build: 
      context: ./backend
    command: celery -A app.core.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      - api
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/blot
      - REDIS_URL=redis://redis:6379/0

  # 5. React/Vite Frontend
  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
